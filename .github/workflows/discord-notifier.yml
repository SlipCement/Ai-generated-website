name: Custom Discord Notification

on:
  push:
    branches:
      - main  # Change this to 'master' if your default branch uses that name

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Custom Discord Message
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: \${{ secrets.DISCORD_WEBHOOK }}
          status: "" # Disables the default "Success/Failure" status prefix
          title: "🚀 New Commit Pushed"
          color: 0x3498db
          description: |
            **Commit Message**
            \${{ github.event.head_commit.message }}

            **Commit Identifier (SHA)**
            `${{ github.sha }}`

            **Project Website**
            [jaspersbrowser](https://tinyurl.com)
