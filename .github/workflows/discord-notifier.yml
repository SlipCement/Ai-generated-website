name: Custom Discord Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send commit notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK secret is not configured."
            exit 1
          fi

          payload=$(jq -n \
            --arg message "$COMMIT_MESSAGE" \
            '{
              embeds: [{
                title: "New Commit Pushed",
                description: ("**Commit Message**\n\n" + $message),
                color: 3447003,
                fields: [
                  {
                    name: "Website",
                    value: "[Open Jaspers Browser](https://tinyurl.com/jaspersbrowser)",
                    inline: false
                  }
                ]
              }]
            }')

          curl -fsS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            --data "$payload"
