name: Custom Discord Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Custom Discord Message
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ""
          title: "🚀 New Commit Pushed"
          color: 0x3498db
          description: |
            **Commit Message**
            ${{ github.event.head_commit.message }}

            **Author**
            ${{ github.event.head_commit.author.name }}

            **Commit**
            [${{ github.sha }}](${{ github.event.head_commit.url }})

            **Compare Changes**
            [View the changes](${{ github.event.compare }})
