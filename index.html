<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>:D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b, #111827);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 30px;
      -webkit-user-select: none;
      user-select: none;
    }

    .bg-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(0, 255, 255, 0.15);
      filter: blur(100px);
      z-index: -1;
      animation: floatGlow 10s infinite alternate ease-in-out;
      will-change: transform;
    }

    .bg-glow:nth-child(1) {
      top: -150px;
      left: -100px;
    }

    .bg-glow:nth-child(2) {
      bottom: -200px;
      right: -100px;
      background: rgba(255, 0, 200, 0.12);
      animation-delay: 2s;
    }

    @keyframes floatGlow {
      from {
        transform: translateY(0px) translateX(0px);
      }
      to {
        transform: translateY(40px) translateX(30px);
      }
    }

    h1 {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 10px;
      background: linear-gradient(to right, cyan, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      opacity: 0.8;
      margin-bottom: 35px;
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .wide-card {
      grid-column: span 2;
    }

    .small-card {
      max-width: 100%;
    }

    @media (max-width: 800px) {
      .search-grid {
        grid-template-columns: 1fr;
      }

      .wide-card {
        grid-column: span 1;
      }
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 20px;
      transition: 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: cyan;
    }

    .card h2 {
      margin-bottom: 15px;
      font-size: 1.4rem;
    }

    .search-box {
      display: flex;
      gap: 10px;
      position: relative;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      color: white;
      outline: none;
      transition: 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
      font-size: 16px;
    }

    input:focus {
      background: rgba(255,255,255,0.18);
      box-shadow: 0 0 10px cyan;
    }

    input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    button {
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(135deg, cyan, #7c3aed);
      color: white;
      font-weight: bold;
      transition: 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
      font-size: 16px;
    }

    button:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(0.98);
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .quick-links a {
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.08);
      padding: 8px 12px;
      border-radius: 999px;
      transition: 0.2s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .quick-links a:hover {
      background: rgba(0,255,255,0.25);
    }

    .tools {
      max-width: 1200px;
      margin: 40px auto 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .clock {
      font-size: 2rem;
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
      font-family: 'Menlo', 'Courier New', monospace;
      -webkit-font-variant-numeric: tabular-nums;
      font-variant-numeric: tabular-nums;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }

    .light {
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
      color: #111827;
    }

    .light .card {
      background: rgba(255,255,255,0.7);
      color: #111827;
    }

    .light input {
      background: rgba(0,0,0,0.08);
      color: black;
    }

    .light input::placeholder {
      color: rgba(0,0,0,0.5);
    }

    .light textarea {
      background: rgba(0,0,0,0.08) !important;
      color: black !important;
    }

    .light .quick-links a {
      color: black;
      background: rgba(0,0,0,0.06);
    }

    .light button {
      color: white;
    }

    .light button:not(.theme-toggle) {
      background: linear-gradient(135deg, #0891b2, #6d28d9);
    }

    .light h2 {
      color: #111827 !important;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      opacity: 0.7;
    }

    textarea {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-appearance: none;
      appearance: none;
      font-size: 16px;
      color: white;
      background: rgba(255,255,255,0.12) !important;
    }


    /* Widget dashboard */
    .tools {
      display: grid !important;
      grid-template-columns: minmax(260px, 420px) minmax(260px, 420px) !important;
      justify-content: center !important;
      align-items: start !important;
      gap: 20px !important;
      width: 100% !important;
    }
    .tools > div:first-child { display: contents !important; }
    .tools > .card { grid-column: 1 / -1; justify-self: center; }

    .card.widget-ready {
      position: relative !important;
      flex: none !important;
      min-width: 220px !important;
      min-height: 130px !important;
      max-width: none !important;
      box-sizing: border-box !important;
      overflow: visible !important;
      transform: translate(var(--widget-x, 0px), var(--widget-y, 0px));
    }
    .card.widget-ready:hover {
      transform: translate(var(--widget-x, 0px), var(--widget-y, 0px)) translateY(-5px) scale(1.02);
    }
    .card.widget-ready.is-dragging,
    .card.widget-ready.is-resizing {
      transition: none !important;
      transform: translate(var(--widget-x, 0px), var(--widget-y, 0px)) !important;
      z-index: 2000 !important;
    }

    .widget-drag-handle,
    .widget-remove-button,
    .widget-resize-handle { display: none !important; }

    body.widget-editing .widget-drag-handle {
      display: flex !important;
      position: absolute !important;
      top: 10px !important; right: 48px !important;
      width: 30px !important; height: 30px !important;
      padding: 0 !important; align-items: center !important; justify-content: center !important;
      border-radius: 9px !important;
      background: rgba(255,255,255,.12) !important;
      border: 1px solid rgba(255,255,255,.18) !important;
      color: rgba(255,255,255,.85) !important;
      cursor: grab !important; user-select: none !important;
      touch-action: none !important; z-index: 100 !important;
    }
    .widget-drag-handle:active { cursor: grabbing !important; }

    body.widget-editing .widget-remove-button {
      display: block !important;
      position: absolute !important;
      top: 10px !important; right: 10px !important;
      width: 30px !important; height: 30px !important;
      min-width: 30px !important; min-height: 30px !important;
      margin: 0 !important; padding: 0 !important;
      border-radius: 9px !important;
      background: #e5484d !important;
      border: 1px solid rgba(255,255,255,.35) !important;
      color: #fff !important; cursor: pointer !important;
      font-size: 21px !important; line-height: 28px !important;
      text-align: center !important; z-index: 101 !important;
      touch-action: manipulation !important;
    }
    body.widget-editing .widget-remove-button:hover { background: #c9363d !important; }

    body.widget-editing .widget-resize-handle {
      display: block !important;
      position: absolute !important;
      right: 7px !important; bottom: 7px !important;
      width: 24px !important; height: 24px !important;
      cursor: nwse-resize !important; touch-action: none !important;
      z-index: 100 !important;
      border-right: 3px solid rgba(255,255,255,.8) !important;
      border-bottom: 3px solid rgba(255,255,255,.8) !important;
      border-radius: 0 0 4px 0 !important;
    }

    #widget-toolbar {
      position: fixed; top: 20px; left: 20px; z-index: 5000;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    #widget-toolbar button { margin: 0 !important; padding: 10px 14px !important; cursor: pointer !important; }
    #widget-toolbar .widget-edit-control { display: none !important; }
    body.widget-editing #widget-toolbar .widget-edit-control { display: block !important; }

    #widget-picker {
      position: fixed; inset: 0; z-index: 6000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.5); backdrop-filter: blur(6px);
    }
    #widget-picker-panel {
      width: min(360px,90vw); padding: 22px; border-radius: 20px;
      background: #172033; border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      display: flex; flex-direction: column; gap: 10px;
    }
    #widget-picker-panel button { width: 100%; margin: 0; }

    .widget-notes {
      display: flex !important; flex-direction: column !important;
      overflow: hidden !important;
    }
    .widget-notes textarea {
      flex: 1 1 auto !important;
      width: 100% !important; min-height: 70px !important; height: auto !important;
      box-sizing: border-box !important; resize: none !important;
    }
    .widget-notes .notes-done {
      flex: 0 0 auto !important; margin-top: 15px !important; width: 100% !important;
    }

    @media (max-width: 800px) {
      .tools { grid-template-columns: minmax(260px,420px) !important; }
      .tools > .card { grid-column: 1; }
    }

    /* Suggestions dropdown styles */
    .suggestions-dropdown {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 0;
      right: 0;
      background: rgba(20, 20, 30, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .suggestions-dropdown.show {
      display: block;
    }

    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      transition: 0.2s ease;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .suggestion-item:first-child {
      border-radius: 12px 12px 0 0;
    }

    .suggestion-item:last-child {
      border-bottom: none;
      border-radius: 0 0 12px 12px;
    }

    .suggestion-item:only-child {
      border-radius: 12px;
    }

    .suggestion-item:hover {
      background: rgba(255,255,255,0.1);
    }

    .suggestion-icon {
      opacity: 0.6;
      font-size: 1rem;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .suggestion-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .light .suggestions-dropdown {
      background: rgba(240, 240, 245, 0.95);
      color: #111827;
    }

    .light .suggestion-item {
      border-bottom-color: rgba(0,0,0,0.1);
    }

    .light .suggestion-item:hover {
      background: rgba(0,0,0,0.1);
    }

    .search-box-wrapper {
      position: relative;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div style="display:flex; justify-content:center; align-items:center; gap:28px; margin-bottom:10px; flex-wrap:wrap;">

  <div class="tools" style="display:flex; flex-direction:column; align-items:center; gap:25px; max-width:1200px; margin:40px auto 0;">

    </div>

  <footer>
    Built with HTML, CSS, and JavaScript
  </footer>

  <script>

    // Widget dashboard
    (() => {
      const POS_KEY = 'aiGeneratedWebsiteWidgetPositionsV3';
      const REMOVED_KEY = 'aiGeneratedWebsiteRemovedWidgetsV3';

      let positions = {};
      let removed = new Set();
      try { positions = JSON.parse(localStorage.getItem(POS_KEY) || '{}'); } catch {}
      try { removed = new Set(JSON.parse(localStorage.getItem(REMOVED_KEY) || '[]')); } catch {}

      const save = () => {
        localStorage.setItem(POS_KEY, JSON.stringify(positions));
        localStorage.setItem(REMOVED_KEY, JSON.stringify([...removed]));
      };

      function setupWidget(card, index) {
        if (!card.closest('.tools') || card.dataset.widgetReady === 'true') return;

        const id = card.dataset.widgetId || 'widget-' + index;
        card.dataset.widgetId = id;
        if (removed.has(id)) { card.remove(); return; }

        card.classList.add('widget-ready');
        const initial = card.getBoundingClientRect();
        const saved = positions[id] || {};

        if (!saved.w) card.style.width = Math.round(initial.width) + 'px';
        if (!saved.h) card.style.height = Math.round(initial.height) + 'px';
        card.style.setProperty('--widget-x', (Number(saved.x) || 0) + 'px');
        card.style.setProperty('--widget-y', (Number(saved.y) || 0) + 'px');
        if (saved.w) card.style.width = saved.w + 'px';
        if (saved.h) card.style.height = saved.h + 'px';

        const drag = document.createElement('button');
        drag.type = 'button'; drag.className = 'widget-drag-handle';
        drag.textContent = '⠿'; drag.title = 'Drag widget';

        const close = document.createElement('button');
        close.type = 'button'; close.className = 'widget-remove-button';
        close.textContent = '×'; close.title = 'Remove widget';

        const resize = document.createElement('div');
        resize.className = 'widget-resize-handle'; resize.title = 'Resize widget';

        card.append(drag, close, resize);
        card.dataset.widgetReady = 'true';

        let action = null, pointerId = null;
        let sx = 0, sy = 0, startX = 0, startY = 0, startW = 0, startH = 0;

        function begin(ev, type) {
          if (!document.body.classList.contains('widget-editing')) return;
          ev.preventDefault(); ev.stopPropagation();
          action = type; pointerId = ev.pointerId;
          sx = ev.clientX; sy = ev.clientY;
          startX = parseFloat(card.style.getPropertyValue('--widget-x')) || 0;
          startY = parseFloat(card.style.getPropertyValue('--widget-y')) || 0;
          const r = card.getBoundingClientRect();
          startW = r.width; startH = r.height;
          card.classList.toggle('is-dragging', type === 'move');
          card.classList.toggle('is-resizing', type === 'resize');
          ev.currentTarget.setPointerCapture?.(pointerId);
        }

        function move(ev) {
          if (!action || ev.pointerId !== pointerId) return;
          ev.preventDefault(); ev.stopPropagation();
          const dx = ev.clientX - sx, dy = ev.clientY - sy;

          if (action === 'move') {
            card.style.setProperty('--widget-x', (startX + dx) + 'px');
            card.style.setProperty('--widget-y', (startY + dy) + 'px');
          } else {
            card.style.width = Math.max(220, Math.round(startW + dx)) + 'px';
            card.style.height = Math.max(130, Math.round(startH + dy)) + 'px';
          }
        }

        function end(ev) {
          if (!action || ev.pointerId !== pointerId) return;
          ev.preventDefault(); ev.stopPropagation();

          if (action === 'move') {
            positions[id] = {...(positions[id] || {}),
              x: parseFloat(card.style.getPropertyValue('--widget-x')) || 0,
              y: parseFloat(card.style.getPropertyValue('--widget-y')) || 0};
          } else {
            positions[id] = {...(positions[id] || {}),
              w: card.getBoundingClientRect().width,
              h: card.getBoundingClientRect().height};
          }

          save();
          card.classList.remove('is-dragging', 'is-resizing');
          try { ev.currentTarget.releasePointerCapture?.(pointerId); } catch {}
          action = null; pointerId = null;
        }

        drag.addEventListener('pointerdown', ev => begin(ev,'move'));
        resize.addEventListener('pointerdown', ev => begin(ev,'resize'));
        drag.addEventListener('pointermove', move);
        resize.addEventListener('pointermove', move);
        drag.addEventListener('pointerup', end);
        resize.addEventListener('pointerup', end);
        drag.addEventListener('pointercancel', end);
        resize.addEventListener('pointercancel', end);

        close.addEventListener('pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); });
        close.addEventListener('click', ev => {
          ev.preventDefault(); ev.stopPropagation();
          removed.add(id); delete positions[id]; save(); card.remove();
        });
      }

      document.querySelectorAll('.tools .card').forEach((card,i) => setupWidget(card,i));

      const toolbar = document.createElement('div');
      toolbar.id = 'widget-toolbar';
      toolbar.innerHTML =
        '<button type="button" id="widget-edit-toggle">Edit Widgets</button>' +
        '<button type="button" class="widget-edit-control" id="widget-add-button">＋ Add Widget</button>' +
        '<button type="button" class="widget-edit-control" id="widget-reset-button">Reset Widgets</button>';
      document.body.appendChild(toolbar);

      const editButton = document.getElementById('widget-edit-toggle');
      editButton.addEventListener('click', ev => {
        ev.preventDefault(); ev.stopPropagation();
        const editing = document.body.classList.toggle('widget-editing');
        editButton.textContent = editing ? 'Done Editing' : 'Edit Widgets';
      });

      document.getElementById('widget-reset-button').addEventListener('click', ev => {
        ev.preventDefault(); ev.stopPropagation();
        localStorage.removeItem(POS_KEY); localStorage.removeItem(REMOVED_KEY);
        location.reload();
      });

      document.getElementById('widget-add-button').addEventListener('click', ev => {
        ev.preventDefault(); ev.stopPropagation();
        if (document.getElementById('widget-picker')) {
          document.getElementById('widget-picker').remove(); return;
        }

        const picker = document.createElement('div');
        picker.id = 'widget-picker';
        picker.innerHTML =
          '<div id="widget-picker-panel"><h3>Add Widget</h3>' +
          '<button type="button" data-widget-type="clock">🕐 Live Clock</button>' +
          '<button type="button" data-widget-type="notes">📝 Quick Notes</button>' +
          '<button type="button" data-widget-type="github">🐙 GitHub</button>' +
          '<button type="button" id="widget-picker-cancel">Cancel</button></div>';
        document.body.appendChild(picker);

        picker.querySelector('#widget-picker-cancel').addEventListener('click', ev => {
          ev.preventDefault(); ev.stopPropagation(); picker.remove();
        });

        picker.querySelectorAll('[data-widget-type]').forEach(button => {
          button.addEventListener('click', ev => {
            ev.preventDefault(); ev.stopPropagation();

            const type = button.dataset.widgetType;
            const id = 'extra-' + type;
            if (document.querySelector('[data-widget-id="' + id + '"]')) {
              picker.remove(); return;
            }

            removed.delete(id);
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.widgetId = id;

            if (type === 'clock') {
              card.innerHTML = '<h2>Live Clock</h2><div class="clock" data-extra-clock>00:00:00</div>';
              const tick = () => {
                const el = card.querySelector('[data-extra-clock]');
                if (el) el.textContent = new Date().toLocaleTimeString();
              };
              tick(); setInterval(tick,1000);
            } else if (type === 'notes') {
              card.classList.add('widget-notes');
              card.innerHTML =
                '<h2>Quick Notes</h2><textarea class="extra-notes-box" placeholder="Write something..."></textarea>' +
                '<button class="notes-done" type="button">Done</button>';
              const box = card.querySelector('.extra-notes-box');
              const key = 'jasperSearchNotesExtra';
              box.value = localStorage.getItem(key) || '';
              card.querySelector('.notes-done').addEventListener('click', ev => {
                ev.preventDefault(); ev.stopPropagation();
                localStorage.setItem(key, box.value);
                const b = card.querySelector('.notes-done');
                b.textContent = 'Saved!';
                setTimeout(() => { if (b.isConnected) b.textContent = 'Done'; },900);
              });
            } else {
              card.style.cssText =
                'width:100%; max-width:420px; border:1px solid #3a3f46; background:rgba(245,245,245,0.05); text-align:center;';
              card.innerHTML =
                '<h2 style="font-size:2rem; margin-bottom:20px;">GitHub</h2>' +
                '<button type="button" class="github-widget-button" style="width:100%; background:#24292f; font-size:1.2rem; padding:20px; color:white;">Open GitHub</button>';
              card.querySelector('.github-widget-button').addEventListener('click', ev => {
                ev.preventDefault(); ev.stopPropagation();
                window.location.href='https://github.com';
              });
            }

            document.querySelector('.tools').appendChild(card);
            setupWidget(card, document.querySelectorAll('.tools .card').length - 1);
            save(); picker.remove();
          });
        });
      });
    })();

    // Debounce function for API calls
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    function fetchDuckDuckGoSuggestions(query) {
  return new Promise((resolve) => {
    if (!query.trim()) {
      resolve([]);
      return;
    }

    const callbackName =
      'ddg_' + Math.random().toString(36).slice(2);

    window[callbackName] = function(data) {
      resolve(
        data.map(item => item.phrase).slice(0, 8)
      );

      delete window[callbackName];
      script.remove();
    };

    const script = document.createElement('script');

    script.src =
      `https://duckduckgo.com/ac/?q=${encodeURIComponent(query)}&callback=${callbackName}`;

    script.onerror = () => {
      resolve([]);
      delete window[callbackName];
      script.remove();
    };

    document.body.appendChild(script);
  });
}

    // Fetch suggestions from Google using custom search API
    async function fetchGoogleSuggestions(query) {
  return await fetchDuckDuckGoSuggestions(query);
}
    // Fetch suggestions from YouTube using API
    async function fetchYouTubeSuggestions(query) {
  return await fetchDuckDuckGoSuggestions(query);
}

    // Fetch Wikipedia suggestions
    async function fetchWikipediaSuggestions(query) {
      if (!query.trim()) return [];
      try {
        const response = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`);
        const data = await response.json();
        return data.query.search.map(item => item.title);
      } catch (e) {
        console.error('Error fetching Wikipedia suggestions:', e);
        return [];
      }
    }

    // Display suggestions in dropdown
    function displaySuggestions(suggestions, dropdownId, inputId) {
      const dropdown = document.getElementById(dropdownId);
      const input = document.getElementById(inputId);
      
      if (suggestions.length === 0) {
        dropdown.classList.remove('show');
        return;
      }

      dropdown.innerHTML = suggestions.slice(0, 8).map(suggestion => `
        <div class="suggestion-item" onclick="setSuggestion('${inputId}', '${suggestion.replace(/'/g, "\\'")}')">
          <svg class="suggestion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <span class="suggestion-text">${escapeHtml(suggestion)}</span>
        </div>
      `).join('');

      dropdown.classList.add('show');
    }

    // Set suggestion text to input
    function setSuggestion(inputId, suggestion) {
      const input = document.getElementById(inputId);
      input.value = suggestion;
      
      // Close dropdown
      const dropdownId = inputId.replace('Input', 'Suggestions');
      document.getElementById(dropdownId).classList.remove('show');
      
      // Focus on input
      input.focus();
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Create debounced fetch functions
    const duckDuckGoFetch = debounce(async (query) => {
      const suggestions = await fetchDuckDuckGoSuggestions(query);
      displaySuggestions(suggestions, 'duckSuggestions', 'duckInput');
    }, 300);

    const googleFetch = debounce(async (query) => {
      const suggestions = await fetchGoogleSuggestions(query);
      displaySuggestions(suggestions, 'googleSuggestions', 'googleInput');
    }, 300);

    const youtubeFetch = debounce(async (query) => {
      const suggestions = await fetchYouTubeSuggestions(query);
      displaySuggestions(suggestions, 'youtubeSuggestions', 'youtubeInput');
    }, 300);

    const wikipediaFetch = debounce(async (query) => {
      const suggestions = await fetchWikipediaSuggestions(query);
      displaySuggestions(suggestions, 'wikiSuggestions', 'wikiInput');
    }, 300);

    // Add event listeners for input changes
    document.getElementById('duckInput').addEventListener('input', (e) => {
      duckDuckGoFetch(e.target.value);
    });

    document.getElementById('googleInput').addEventListener('input', (e) => {
      googleFetch(e.target.value);
    });

    document.getElementById('youtubeInput').addEventListener('input', (e) => {
      youtubeFetch(e.target.value);
    });

    document.getElementById('wikiInput').addEventListener('input', (e) => {
      wikipediaFetch(e.target.value);
    });

    // Close suggestions on blur
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box-wrapper')) {
        document.querySelectorAll('.suggestions-dropdown').forEach(el => {
          el.classList.remove('show');
        });
      }
    });

    function openEngine(type) {
      const engines = {
        google: 'https://www.google.com',
        duck: 'https://duckduckgo.com',
        youtube: 'https://www.youtube.com',
        wiki: 'https://en.wikipedia.org'
      };

      const inputIds = {
        google: 'googleInput',
        duck: 'duckInput',
        youtube: 'youtubeInput',
        wiki: 'wikiInput'
      };

      const input = document.getElementById(inputIds[type]);
      const query = input ? input.value.trim() : '';

      if (query) {
        let url = '';
        if (type === 'google') url = 'https://www.google.com/search?q=';
        if (type === 'duck') url = 'https://duckduckgo.com/?q=';
        if (type === 'youtube') url = 'https://www.youtube.com/results?search_query=';
        if (type === 'wiki') url = 'https://en.wikipedia.org/wiki/Special:Search?search=';

        window.location.href = url + encodeURIComponent(query);
      } else {
        window.location.href = engines[type];
      }
    }

    function handleCardClick(type, event) {
      const tag = event.target.tagName.toLowerCase();
      if (tag === 'input' || tag === 'button' || tag === 'textarea') return;
      openEngine(type);
    }

    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString();
      document.getElementById('clock').textContent = time;
    }

    setInterval(updateClock, 1000);
    updateClock();

    function saveNotes() {
      const box = document.getElementById('notesBox');
      if (!box) return;
      localStorage.setItem('jasperSearchNotes', box.value);
      const button = box.parentElement.querySelector('.notes-done');
      if (button) {
        button.textContent = 'Saved!';
        setTimeout(() => { if (button.isConnected) button.textContent = 'Done'; }, 900);
      }
    }

    window.addEventListener('load', () => {
      const saved = localStorage.getItem('jasperSearchNotes');
      if(saved) {
        document.getElementById('notesBox').value = saved;
      }
      // Focus on DuckDuckGo search bar on page load
      document.getElementById('duckInput').focus();
    });

    function toggleTheme() {
      document.body.classList.toggle('light');
      localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
    }

    // Load saved theme preference
    window.addEventListener('load', () => {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light');
      }
    });

    // Add Enter/Return key support for search inputs
    document.getElementById('duckInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') openEngine('duck');
    });

    document.getElementById('googleInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') openEngine('google');
    });

    document.getElementById('youtubeInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') openEngine('youtube');
    });

    document.getElementById('wikiInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') openEngine('wiki');
    });

    // Add Cmd+Enter support for notes textarea (Mac) and Ctrl+Enter (Windows/Linux)
    document.getElementById('notesBox').addEventListener('keypress', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        saveNotes();
      }
    });

    // Handle all link clicks to open in current tab
    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link && !e.target.closest('.suggestions-dropdown')) {
        e.preventDefault();
        window.location.href = link.href;
      }
    });

// Prevent browser autocomplete history
document.querySelectorAll('input[type="search"]').forEach(input => {
  input.setAttribute('autocomplete', 'off');

  input.addEventListener('focus', () => {
    input.setAttribute('readonly', true);
    setTimeout(() => {
      input.removeAttribute('readonly');
    }, 50);
  });
