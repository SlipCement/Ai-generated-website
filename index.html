<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>:D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b, #111827);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 30px;
      -webkit-user-select: none;
      user-select: none;
    }

    .bg-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(0, 255, 255, 0.15);
      filter: blur(100px);
      z-index: -1;
      animation: floatGlow 10s infinite alternate ease-in-out;
      will-change: transform;
    }

    .bg-glow:nth-child(1) {
      top: -150px;
      left: -100px;
    }

    .bg-glow:nth-child(2) {
      bottom: -200px;
      right: -100px;
      background: rgba(255, 0, 200, 0.12);
      animation-delay: 2s;
    }

    @keyframes floatGlow {
      from {
        transform: translateY(0px) translateX(0px);
      }
      to {
        transform: translateY(40px) translateX(30px);
      }
    }

    h1 {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 10px;
      background: linear-gradient(to right, cyan, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      opacity: 0.8;
      margin-bottom: 35px;
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .wide-card {
      grid-column: span 2;
    }

    .small-card {
      max-width: 100%;
    }

    /* Theme picker */
    #theme-picker-toggle {
      position: fixed; top: 20px; right: 20px; z-index: 5000;
      padding: 10px 14px !important; cursor: pointer !important;
    }


    #theme-picker {
      position: fixed; top: 62px; right: 20px; z-index: 7000;
      display: none; width: min(280px, 90vw); max-height: 80vh; overflow-y: auto;
      padding: 12px; border-radius: 16px;
      background: rgba(20,20,30,.97); border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 15px 45px rgba(0,0,0,.45); backdrop-filter: blur(10px);
    }
    #theme-picker.show { display: block; }
    #theme-picker button {
      width: 100%; margin: 4px 0; padding: 10px 12px;
      text-align: left; border-radius: 10px; cursor: pointer;
    }
    .custom-theme-title {
      margin: 14px 2px 7px; padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.14); font-weight: 700;
    }
    .custom-theme-form { display:flex; flex-direction:column; gap:7px; }
    .custom-theme-form > input {
      box-sizing:border-box; width:100%; padding:9px 10px;
      border-radius:9px; border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.08); color:white;
    }
    .custom-theme-form label {
      display:flex; align-items:center; justify-content:space-between;
      font-size:13px; padding:3px 2px;
    }
    .custom-theme-form input[type="color"] {
      width:42px; height:28px; padding:0; border:0; background:none;
      cursor:pointer;
    }

    @media (max-width: 800px) {
      .search-grid {
        grid-template-columns: 1fr;
      }

      .wide-card {
        grid-column: span 1;
      }
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 20px;
      transition: 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: cyan;
    }

    .card h2 {
      margin-bottom: 15px;
      font-size: 1.4rem;
    }

    .search-box {
      display: flex;
      gap: 10px;
      position: relative;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      color: white;
      outline: none;
      transition: 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
      font-size: 16px;
    }

    input:focus {
      background: rgba(255,255,255,0.18);
      box-shadow: 0 0 10px cyan;
    }

    input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    button {
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(135deg, cyan, #7c3aed);
      color: white;
      font-weight: bold;
      transition: 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
      font-size: 16px;
    }

    button:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(0.98);
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .quick-links a {
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.08);
      padding: 8px 12px;
      border-radius: 999px;
      transition: 0.2s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .quick-links a:hover {
      background: rgba(0,255,255,0.25);
    }

    .tools {
      max-width: 1200px;
      margin: 40px auto 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .clock {
      font-size: 2rem;
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
      font-family: 'Menlo', 'Courier New', monospace;
      -webkit-font-variant-numeric: tabular-nums;
      font-variant-numeric: tabular-nums;
    }

    .light {
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
      color: #111827;
    }

    .light .card {
      background: rgba(255,255,255,0.7);
      color: #111827;
    }

    .light input {
      background: rgba(0,0,0,0.08);
      color: black;
    }

    .light input::placeholder {
      color: rgba(0,0,0,0.5);
    }

    .light textarea {
      background: rgba(0,0,0,0.08) !important;
      color: black !important;
    }

    .light .quick-links a {
      color: black;
      background: rgba(0,0,0,0.06);
    }

    .light button {
      color: white;
    }

    .light button:not(.theme-toggle) {
      background: linear-gradient(135deg, #0891b2, #6d28d9);
    }

    .light h2 {
      color: #111827 !important;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      opacity: 0.7;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      outline: none;
      resize: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-appearance: none;
      appearance: none;
      font-size: 16px;
      line-height: 1.45;
      color: white;
      background: rgba(255,255,255,0.12) !important;
      transition: 0.2s ease;
    }
    textarea:focus {
      background: rgba(255,255,255,0.18) !important;
      border-color: rgba(0,255,255,0.55);
      box-shadow: 0 0 10px rgba(0,255,255,0.2);
    }


    /* Widget dashboard */
    .tools {
      position: relative !important;
      width: min(1200px, 100%) !important;
      max-width: 1200px !important;
      min-height: 900px !important;
      margin: 40px auto 0 !important;
      display: block !important;
    }
    .tools > div:first-child { display: contents !important; }

    .card.widget-ready {
      position: absolute !important;
      left: var(--widget-left, 0px) !important;
      top: var(--widget-top, 0px) !important;
      width: var(--widget-width, 400px) !important;
      height: var(--widget-height, auto) !important;
      min-width: 220px !important;
      min-height: 130px !important;
      max-width: none !important;
      margin: 0 !important;
      box-sizing: border-box !important;
      overflow: visible !important;
      transform: translate(var(--widget-x, 0px), var(--widget-y, 0px));
      transition: 0.3s ease;
    }
    .card.widget-ready:hover {
      transform: translate(var(--widget-x, 0px), var(--widget-y, 0px)) translateY(-5px) scale(1.02);
    }
    body.widget-editing .card.widget-ready.is-dragging,
    body.widget-editing .card.widget-ready.is-resizing {
      transition: none !important;
      transform: translate(var(--widget-x, 0px), var(--widget-y, 0px)) !important;
      z-index: 2000 !important;
    }

    body.widget-editing .widget-resize-handle { resize: both; }

    .widget-drag-handle,
    .widget-remove-button,
    .widget-resize-handle { display: none !important; }

    body.widget-editing .widget-drag-handle {
      display: flex !important;
      position: absolute !important;
      top: 10px !important; right: 48px !important;
      width: 30px !important; height: 30px !important;
      padding: 0 !important; align-items: center !important; justify-content: center !important;
      border-radius: 9px !important;
      background: rgba(255,255,255,.12) !important;
      border: 1px solid rgba(255,255,255,.18) !important;
      color: rgba(255,255,255,.85) !important;
      cursor: grab !important; user-select: none !important;
      touch-action: none !important; z-index: 100 !important;
    }
    .widget-drag-handle:active { cursor: grabbing !important; }
    .widget-ready[data-widget-id^="engine-"] .widget-drag-handle {
      font-size: 17px !important;
    }


    body.widget-editing .widget-remove-button {
      display: block !important;
      position: absolute !important;
      top: 10px !important; right: 10px !important;
      width: 30px !important; height: 30px !important;
      min-width: 30px !important; min-height: 30px !important;
      margin: 0 !important; padding: 0 !important;
      border-radius: 9px !important;
      background: #e5484d !important;
      border: 1px solid rgba(255,255,255,.35) !important;
      color: #fff !important; cursor: pointer !important;
      font-size: 21px !important; line-height: 28px !important;
      text-align: center !important; z-index: 101 !important;
      touch-action: manipulation !important;
    }

    body.widget-editing .widget-resize-handle {
      display: block !important;
      position: absolute !important;
      right: 7px !important; bottom: 7px !important;
      width: 24px !important; height: 24px !important;
      cursor: nwse-resize !important; touch-action: none !important;
      z-index: 100 !important;
      border-right: 3px solid rgba(255,255,255,.8) !important;
      border-bottom: 3px solid rgba(255,255,255,.8) !important;
      border-radius: 0 0 4px 0 !important;
    }

    #widget-toolbar {
      position: fixed; top: 20px; left: 20px; z-index: 5000;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    #widget-toolbar button { margin: 0 !important; padding: 10px 14px !important; cursor: pointer !important; }
    #widget-toolbar .widget-edit-control { display: none !important; }
    body.widget-editing #widget-toolbar .widget-edit-control { display: block !important; }
    #widget-toolbar #widget-snap-toggle { display: none !important; }
    body.widget-editing #widget-toolbar #widget-snap-toggle { display: block !important; }
    #widget-toolbar #widget-snap-toggle {
      min-width: 120px;
    }
    #widget-toolbar #widget-snap-toggle.snap-off {
      opacity: .7;
      filter: grayscale(.5);
    }
    body.widget-editing #widget-toolbar .widget-edit-control { display: block !important; }

    #widget-picker {
      position: fixed; inset: 0; z-index: 6000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.5); backdrop-filter: blur(6px);
    }
    #widget-picker-panel {
      width: min(420px,92vw); max-height: 88vh; overflow-y: auto;
      padding: 22px; border-radius: 20px;
      background: #172033; border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      display: flex; flex-direction: column; gap: 10px;
    }
    #widget-picker-panel input,
    #widget-picker-panel select,
    #widget-picker-panel textarea {
      width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.08); color: white; outline: none;
      font-size: 15px;
    }
    #widget-picker-panel label { font-size: .85rem; opacity: .8; margin-top: 4px; }
    #widget-picker-panel button { width: 100%; margin: 0; }

    .custom-widget-form { display: flex; flex-direction: column; gap: 8px; }
    .custom-widget-help { font-size: .78rem; opacity: .65; line-height: 1.4; }
    .custom-api-output {
      margin-top: 12px; max-height: 220px; overflow: auto;
      padding: 10px; border-radius: 10px;
      background: rgba(0,0,0,.22); white-space: pre-wrap; word-break: break-word;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .custom-widget-button { width: 100%; }
    .widget-notes {
      display: flex !important; flex-direction: column !important;
      overflow: hidden !important;
    }
    .widget-notes textarea {
      flex: 1 1 auto !important; width: 100% !important;
      min-height: 70px !important; height: auto !important;
      box-sizing: border-box !important; resize: none !important;
    }
    .widget-notes .notes-done {
      flex: 0 0 auto !important; margin-top: 15px !important; width: 100% !important;
    }

    .search-engine-change {
      display: none !important;
      position: absolute !important;
      top: 48px !important;
      right: 10px !important;
      margin: 0 !important;
      padding: 6px 9px !important;
      font-size: 12px !important;
      border-radius: 9px !important;
      z-index: 102 !important;
    }
    body.widget-editing .search-engine-change {
      display: inline-block !important;
    }
    .engine-picker {
      position: absolute; top: 42px; right: 8px; z-index: 10000;
      display: none; min-width: 180px; padding: 8px;
      border-radius: 12px; background: rgba(20,20,30,.97);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 15px 40px rgba(0,0,0,.4);
    }
.engine-picker.show { display: block; }
    .engine-picker button {
      display: block; width: 100%; margin: 3px 0; text-align: left;
      background: rgba(255,255,255,.08);
    }

    @media (max-width: 800px) {
      .tools { min-height: 1500px !important; }
    }
    /* Suggestions dropdown styles */
    .suggestions-dropdown {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 0;
      right: 0;
      background: rgba(20, 20, 30, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .suggestions-dropdown.show {
      display: block;
    }

    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      transition: 0.2s ease;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .suggestion-item:first-child {
      border-radius: 12px 12px 0 0;
    }

    .suggestion-item:last-child {
      border-bottom: none;
      border-radius: 0 0 12px 12px;
    }

    .suggestion-item:only-child {
      border-radius: 12px;
    }

    .suggestion-item:hover {
      background: rgba(255,255,255,0.1);
    }

    .suggestion-icon {
      opacity: 0.6;
      font-size: 1rem;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .suggestion-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .light .suggestions-dropdown {
      background: rgba(240, 240, 245, 0.95);
      color: #111827;
    }

    .light .suggestion-item {
      border-bottom-color: rgba(0,0,0,0.1);
    }

    .light .suggestion-item:hover {
      background: rgba(0,0,0,0.1);
    }

    .search-box-wrapper {
      position: relative;
    }
      .project-repo-link {
      display: inline-block;
      padding: 9px 15px;
      border-radius: 12px;
      background: var(--repo-link-bg, #fff);
      color: var(--repo-link-text, #111) !important;
      text-decoration: none;
      font-weight: 800;
      border: 1px solid color-mix(in srgb, var(--repo-link-text, #111) 35%, transparent);
      box-shadow: 0 8px 22px rgba(0,0,0,.18);
      transition: transform .2s ease, filter .2s ease;
    }
    .project-repo-link:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.08);
    }
</style>
</head>

  <div class="bg-glow"></div>
  <div class="bg-glow"></div>

  <div style="display:flex; justify-content:center; align-items:center; gap:28px; margin-bottom:10px; flex-wrap:wrap;">
    <a href="https://duckduckgo.com" style="transition:0.2s;">
      <img src="https://upload.wikimedia.org/wikipedia/en/9/90/The_DuckDuckGo_Duck.png" alt="DuckDuckGo" style="height:64px; cursor:pointer; filter:drop-shadow(0 0 10px rgba(227,113,81,0.4));">

      <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube" style="height:52px; cursor:pointer; filter:drop-shadow(0 0 10px rgba(255,0,0,0.4));">

        <div class="suggestions-dropdown" id="youtubeSuggestions"></div>

          <button onclick="openEngine('wiki')">Go</button>
        </div>
        <div class="suggestions-dropdown" id="wikiSuggestions"></div>
      </div>

  </div>

  <div class="tools" style="display:flex; flex-direction:column; align-items:center; gap:25px; max-width:1200px; margin:40px auto 0;">

    <div style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap; width:100%;">

      <div class="card" data-widget-id="clock" style="flex:1; min-width:260px; max-width:420px;">
        <h2>Live Clock</h2>
        <div class="clock" id="clock">00:00:00</div>
      </div>

      <div class="card widget-notes" data-widget-id="notes" style="flex:1; min-width:260px; max-width:420px;">
        <h2>Quick Notes</h2>
        <textarea id="notesBox" placeholder="Write something..."></textarea>
        <button class="notes-done" onclick="saveNotes()">Done</button>
      </div>

    </div>

    <div class="card" data-widget-id="github" style="width:100%; max-width:420px; border:1px solid #3a3f46; background:rgba(245,245,245,0.05); text-align:center;">
      <h2 style="font-size:2rem; margin-bottom:20px;">GitHub</h2>
      <button style="width:100%; background:#24292f; font-size:1.2rem; padding:20px; color: white;" onclick="window.location.href='https://github.com'">Open GitHub</button>
    </div>

  </div>

  <<a href="https://github.com/SlipCement/Ai-generated-website" target="_blank" rel="noopener noreferrer"><span class="project-repo-link">View this project on GitHub</span></a></footer>

  <script>

    // Widget dashboard
    (() => {
      const POS_KEY = 'aiGeneratedWebsiteWidgetPositionsV6';
      const REMOVED_KEY = 'aiGeneratedWebsiteRemovedWidgetsV6';
      const EDITING_KEY = 'aiGeneratedWebsiteWidgetEditing';
      let positions = {};
      let removed = new Set();
      let dirty = false;
      const SNAP_KEY='aiGeneratedWidgetSnap';
      const SNAP_SIZE=20;
      let snapEnabled=localStorage.getItem(SNAP_KEY)!=='0';
      const snap=n=>snapEnabled ? Math.round(n/SNAP_SIZE)*SNAP_SIZE : Math.round(n);

      try { positions = JSON.parse(localStorage.getItem(POS_KEY) || '{}'); } catch {}
      try { removed = new Set(JSON.parse(localStorage.getItem(REMOVED_KEY) || '[]')); } catch {}

      const save = () => {
        localStorage.setItem(POS_KEY, JSON.stringify(positions));
        localStorage.setItem(REMOVED_KEY, JSON.stringify([...removed]));
        dirty = true;
      };

      const canvas = document.querySelector('.tools');

      // Search engines are widgets too. Move them into the same independent
      // canvas so they can be dragged, resized, hidden, and reset exactly
      // like the other widgets.
      const searchGrid = document.querySelector('.search-grid');
      const engineCards = searchGrid ? [...searchGrid.querySelectorAll('.card')] : [];
      const engineTypes = ['duck','google','youtube','wiki'];
      engineCards.forEach((card,i) => {
        const type = engineTypes[i];
        if (!type) return;
        card.dataset.widgetId = 'engine-' + type;
        card.classList.remove('wide-card','small-card');
        canvas.appendChild(card);
      });
      if (searchGrid) searchGrid.remove();

      function defaultPosition(id, index) {
        const wide = window.innerWidth > 800;
        const gap = 20;
        const cardW = 400;
        if (!wide) {
          return { x: 0, y: index * 245 };
        }
        const center = Math.max(0, (canvas.clientWidth - (cardW * 2 + gap)) / 2);

        const defaults = {
          'engine-duck':   { x: center, y: 0 },
          'engine-google': { x: center + cardW + gap, y: 0 },
          'engine-youtube':{ x: center, y: 245 },
          'engine-wiki':   { x: center + cardW + gap, y: 245 },
          'clock':         { x: center, y: 490 },
          'notes':         { x: center + cardW + gap, y: 490 },
          'github':        { x: center, y: 760 }
        };
        return defaults[id] || {
          x: center,
          y: 760 + Math.max(0,index-6) * 245
        };
      }

      function updateCanvasHeight() {
        let bottom = 900;
        canvas.querySelectorAll('.card.widget-ready').forEach(card => {
          const top = parseFloat(card.style.getPropertyValue('--widget-top')) || 0;
          const y = parseFloat(card.style.getPropertyValue('--widget-y')) || 0;
          const h = card.getBoundingClientRect().height || 130;
          bottom = Math.max(bottom, top + y + h + 40);
        });
        canvas.style.minHeight = Math.ceil(bottom) + 'px';
      }

      function markDirty() { dirty = true; }

      function setupWidget(card, index) {
        if (!card.closest('.tools') || card.dataset.widgetReady === 'true') return;
        const id = card.dataset.widgetId || ('widget-' + Date.now() + '-' + index);
        card.dataset.widgetId = id;
        if (removed.has(id)) { card.remove(); return; }

        card.classList.add('widget-ready');
        const saved = positions[id] || {};
        const def = defaultPosition(id, index);
        const x = Number.isFinite(saved.x) ? saved.x : 0;
        const y = Number.isFinite(saved.y) ? saved.y : 0;
        const left = Number.isFinite(saved.left) ? saved.left : def.x;
        const top = Number.isFinite(saved.top) ? saved.top : def.y;
        const width = Number.isFinite(saved.w) ? saved.w : 400;
        const height = Number.isFinite(saved.h) ? saved.h : null;

        card.style.setProperty('--widget-left', left + 'px');
        card.style.setProperty('--widget-top', top + 'px');
        card.style.setProperty('--widget-x', x + 'px');
        card.style.setProperty('--widget-y', y + 'px');
        card.style.setProperty('--widget-width', width + 'px');
        if (height) card.style.height = height + 'px';

        const drag = document.createElement('button');
        drag.type='button'; drag.className='widget-drag-handle'; drag.textContent='⠿'; drag.title='Drag widget';
        const close = document.createElement('button');
        close.type='button'; close.className='widget-remove-button'; close.textContent='×'; close.title='Remove widget';
        const resize = document.createElement('div');
        resize.className='widget-resize-handle'; resize.title='Resize widget';
        card.append(drag,close,resize);
        card.dataset.widgetReady='true';

        let action=null,pointerId=null,sx=0,sy=0,startX=0,startY=0,startW=0,startH=0;

        function begin(ev,type) {
          if (!document.body.classList.contains('widget-editing')) return;
          ev.preventDefault(); ev.stopPropagation();
          action=type; pointerId=ev.pointerId; sx=ev.clientX; sy=ev.clientY; dirty=true;
          startX=parseFloat(card.style.getPropertyValue('--widget-x'))||0;
          startY=parseFloat(card.style.getPropertyValue('--widget-y'))||0;
          const r=card.getBoundingClientRect(); startW=r.width; startH=r.height;
          card.classList.toggle('is-dragging',type==='move');
          card.classList.toggle('is-resizing',type==='resize');
          ev.currentTarget.setPointerCapture?.(pointerId);
        }

        function move(ev) {
          if(!action || ev.pointerId!==pointerId) return;
          ev.preventDefault(); ev.stopPropagation();
          const dx=ev.clientX-sx, dy=ev.clientY-sy;
          if(action==='move'){
            card.style.setProperty('--widget-x',snap(startX+dx)+'px');
            card.style.setProperty('--widget-y',snap(startY+dy)+'px');
          } else {
            card.style.setProperty('--widget-width',Math.max(160,snap(startW+dx))+'px');
            card.style.height=Math.max(90,snap(startH+dy))+'px';
          }
          updateCanvasHeight();
        }

        function end(ev) {
          if(!action || ev.pointerId!==pointerId) return;
          ev.preventDefault(); ev.stopPropagation();
          positions[id]={...(positions[id]||{}),
            left:parseFloat(card.style.getPropertyValue('--widget-left'))||0,
            top:parseFloat(card.style.getPropertyValue('--widget-top'))||0,
            x:parseFloat(card.style.getPropertyValue('--widget-x'))||0,
            y:parseFloat(card.style.getPropertyValue('--widget-y'))||0,
            w:card.getBoundingClientRect().width,
            h:card.getBoundingClientRect().height};
          save(); updateCanvasHeight();
          card.classList.remove('is-dragging','is-resizing');
          card.dataset.editorJustFinished = 'true';
          setTimeout(() => delete card.dataset.editorJustFinished, 150);
          try{ev.currentTarget.releasePointerCapture?.(pointerId);}catch{}
          action=null;pointerId=null;
        }

        drag.addEventListener('pointerdown',ev=>begin(ev,'move'));
        resize.addEventListener('pointerdown',ev=>begin(ev,'resize'));
        drag.addEventListener('pointermove',move); resize.addEventListener('pointermove',move);
        drag.addEventListener('pointerup',end); resize.addEventListener('pointerup',end);
        drag.addEventListener('pointercancel',end); resize.addEventListener('pointercancel',end);

        close.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();});
        close.addEventListener('click',ev=>{
          ev.preventDefault();ev.stopPropagation();
          removed.add(id); delete positions[id]; dirty=true; save(); card.remove(); updateCanvasHeight();
        });
      }

      canvas.querySelectorAll('.card').forEach((card,i)=>setupWidget(card,i));
      updateCanvasHeight();

      const toolbar=document.createElement('div');
      toolbar.id='widget-toolbar';
      toolbar.innerHTML='<button type="button" id="widget-edit-toggle">Edit Widgets</button>' +
        '<button type="button" class="widget-edit-control" id="widget-add-button">Add Widget</button>' +
        '<button type="button" class="widget-edit-control" id="widget-focus-button">Set Startup Focus</button>' +
        '<button type="button" class="widget-edit-control" id="widget-restore-search">Restore Search</button>' +
        '<button type="button" class="widget-edit-control" id="widget-reset-button">Reset Widgets</button>' +
        '<button type="button" id="widget-snap-toggle">🧲 Snap: ON</button>';
      document.body.appendChild(toolbar);

      const editButton=document.getElementById('widget-edit-toggle');
      function setEditing(on) {
        document.body.classList.toggle('widget-editing',on);
        editButton.textContent=on?'Done Editing':'Edit Widgets';
        localStorage.setItem(EDITING_KEY,on?'1':'0');
        if(!on) dirty=false;
      }
      editButton.addEventListener('click',ev=>{
        ev.preventDefault();ev.stopPropagation();
        setEditing(!document.body.classList.contains('widget-editing'));
      });

      const snapButton=document.getElementById('widget-snap-toggle');
      function updateSnapButton(){
        snapButton.textContent=snapEnabled?'Snap: ON':'Snap: OFF';
        snapButton.classList.toggle('snap-off',!snapEnabled);
      }
      updateSnapButton();
      snapButton.addEventListener('pointerdown',ev=>ev.stopPropagation());
      snapButton.addEventListener('click',ev=>{
        ev.preventDefault();ev.stopPropagation();
        snapEnabled=!snapEnabled;
        localStorage.setItem(SNAP_KEY,snapEnabled?'1':'0');
        updateSnapButton();
      });


      window.addEventListener('beforeunload',ev=>{
        if(document.body.classList.contains('widget-editing')){
          ev.preventDefault();
          ev.returnValue='Unsaved changes may be lost.';
        }
      });

      document.getElementById('widget-reset-button').addEventListener('click',ev=>{
        ev.preventDefault();ev.stopPropagation();
        if(!confirm('Reset all widget positions, sizes, and removed widgets?')) return;
        localStorage.removeItem(POS_KEY);localStorage.removeItem(REMOVED_KEY);
        location.reload();
      });

      document.getElementById('widget-focus-button').addEventListener('click',ev=>{
        ev.preventDefault();ev.stopPropagation();
        const choices=[
          ['duckInput','DuckDuckGo Search'],
          ['googleInput','Google Search'],
          ['youtubeInput','YouTube Search'],
          ['wikiInput','Wikipedia Search'],
          ['notesBox','Quick Notes']
        ];
        const current=localStorage.getItem('startupFocus')||'duckInput';
        const choice=prompt('Choose the widget to focus when the site opens:\n\n'+choices.map((x,i)=>(i+1)+'. '+x[1]+(x[0]===current?' (current)':'')).join('\n')+'\n\nEnter a number:');
        const n=Number(choice);
        if(Number.isInteger(n)&&choices[n-1]){
          localStorage.setItem('startupFocus',choices[n-1][0]);
          alert('Startup focus set to '+choices[n-1][1]+'.');
        }
      });

      document.getElementById('widget-restore-search').addEventListener('click',ev=>{
        ev.preventDefault();ev.stopPropagation();
        restoreSearchWidget();
      });

      function restoreSearchWidget() {
        const type='google';
        const id='restored-search-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
        const card=document.createElement('div');
        card.className='card';
        card.dataset.widgetId=id;
        card.dataset.restoredSearch='true';
        card.innerHTML='<h2><span class="engine-title">Google Search</span><button type="button" class="search-engine-change" data-engine-card="'+id+'">Change</button></h2><div class="search-box-wrapper"><div class="search-box"><input type="search" placeholder="Search Google..." autocomplete="off"><button type="button">Search</button></div><div class="suggestions-dropdown"></div></div>';
        const input=card.querySelector('input');
        const button=card.querySelector('button');
        const run=()=>{const q=input.value.trim();const selected=input.dataset.engine||'google';const e=(window._searchEngines||{})[selected];if(q&&e) window.location.href=e.search+encodeURIComponent(q);};
        button.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();run();});
        input.addEventListener('keypress',ev=>{if(ev.key==='Enter')run();});
        canvas.appendChild(card);
        setupWidget(card,canvas.querySelectorAll('.card').length-1);
        card.querySelector('.search-engine-change').addEventListener('click',ev=>{
          ev.preventDefault();ev.stopPropagation();
          const picker=document.createElement('div'); picker.className='engine-picker';
          Object.entries(window._searchEngines||{}).forEach(([key,e])=>{
            const b=document.createElement('button'); b.type='button'; b.textContent=e.name;
            b.onclick=x=>{x.preventDefault();x.stopPropagation();
              const old=card.dataset.currentEngine||'google';
              const input=card.querySelector('input');
              input.dataset.engine=key;
              card.querySelector('.engine-title').textContent=e.title;
              card.querySelector('.engine-title').style.color=e.color||'';
              card.style.border='1px solid '+(e.border||e.color||'currentColor');
              card.style.background=e.bg||'';
              input.placeholder=e.placeholder;
              card.dataset.currentEngine=key;
              picker.remove();
            };
            picker.appendChild(b);
          });
          card.appendChild(picker);
          picker.classList.add('show');
        });
        const initialEngine=(window._searchEngines||{}).google;
        if(initialEngine){ card.style.border='1px solid '+initialEngine.border; card.style.background=initialEngine.bg; card.querySelector('.engine-title').style.color=initialEngine.color; }
        positions[id]={left:20,top:20,x:0,y:0};
        card.style.setProperty('--widget-left','20px');
        card.style.setProperty('--widget-top','20px');
        save();updateCanvasHeight();
      }

      function makeCustomWidget() {
        const id='custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
        const title=document.getElementById('customWidgetTitle').value.trim()||'Custom Widget';
        const type=document.getElementById('customWidgetType').value;
        const url=document.getElementById('customWidgetUrl').value.trim();
        const buttonText=document.getElementById('customWidgetButton').value.trim()||'Open';
        const apiKey=document.getElementById('customWidgetApiKey').value.trim();

        if(!url){ alert('Please enter a URL.'); return; }
        if(!/^https?:\/\//i.test(url)){ alert('The URL must start with http:// or https://'); return; }

        const card=document.createElement('div');
        card.className='card';
        card.dataset.widgetId=id;
        card.dataset.customWidget='true';

        const safeTitle=escapeHtml(title);
        if(type==='button' || type==='link'){
          card.innerHTML='<h2>'+safeTitle+'</h2><button type="button" class="custom-widget-button">'+escapeHtml(buttonText)+'</button>';
          card.querySelector('button').addEventListener('click',ev=>{
            ev.preventDefault();ev.stopPropagation();
            window.location.href=url;
          });
        } else if(type==='iframe'){
          card.innerHTML='<h2>'+safeTitle+'</h2><iframe title="'+safeTitle+'" src="'+escapeHtml(url)+'" style="width:100%;height:220px;border:0;border-radius:12px;background:rgba(0,0,0,.15);" loading="lazy"></iframe>';
        } else {
          card.innerHTML='<h2>'+safeTitle+'</h2><div class="custom-api-output">Loading API…</div>';
          const output=card.querySelector('.custom-api-output');
          const headers={};
          if(apiKey) headers.Authorization='Bearer '+apiKey;
          fetch(url,{headers}).then(r=>r.text()).then(text=>{
            try { output.textContent=JSON.stringify(JSON.parse(text),null,2); }
            catch { output.textContent=text; }
          }).catch(err=>{output.textContent='API request failed: '+err.message+' (The API may block browser/CORS requests.)';});
        }

        canvas.appendChild(card);
        setupWidget(card,canvas.querySelectorAll('.card').length-1);
        positions[id]={left:20,top:Math.max(0,canvas.clientHeight-150),x:0,y:0};
        card.style.setProperty('--widget-left','20px');
        card.style.setProperty('--widget-top',Math.max(0,canvas.clientHeight-150)+'px');
        save();updateCanvasHeight();
      }

      document.getElementById('widget-add-button').addEventListener('click',ev=>{
        ev.preventDefault();ev.stopPropagation();
        const old=document.getElementById('widget-picker');
        if(old){old.remove();return;}
        const picker=document.createElement('div');
        picker.id='widget-picker';
        picker.innerHTML='<div id="widget-picker-panel">' +
          '<h3>Add Widget</h3>' +
          '<button type="button" data-widget-type="clock">🕐 Live Clock</button>' +
          '<button type="button" data-widget-type="notes">📝 Quick Notes</button>' +
          '<button type="button" data-widget-type="github">🐙 GitHub</button>' +
          '<button type="button" id="custom-widget-open">🧩 Custom Widget</button>' +
          '<button type="button" id="widget-picker-cancel">Cancel</button>' +
          '</div>';
        document.body.appendChild(picker);

        picker.querySelector('#widget-picker-cancel').onclick=()=>picker.remove();
        picker.querySelectorAll('[data-widget-type]').forEach(button=>{
          button.addEventListener('click',ev=>{
            ev.preventDefault();ev.stopPropagation();
            const type=button.dataset.widgetType;
            const id='extra-'+type+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
            const card=document.createElement('div');
            card.className='card';card.dataset.widgetId=id;

            if(type==='clock'){
              card.innerHTML='<h2>Live Clock</h2><div class="clock" data-extra-clock>00:00:00</div>';
              const tick=()=>{const el=card.querySelector('[data-extra-clock]');if(el)el.textContent=new Date().toLocaleTimeString();};
              tick();setInterval(tick,1000);
            } else if(type==='notes'){
              card.classList.add('widget-notes');
              card.innerHTML='<h2>Quick Notes</h2><textarea class="extra-notes-box" placeholder="Write something..."></textarea><button class="notes-done" type="button">Done</button>';
              const box=card.querySelector('.extra-notes-box');
              card.querySelector('.notes-done').onclick=()=>{
                localStorage.setItem('jasperSearchNotes-'+id,box.value);
                card.querySelector('.notes-done').textContent='Saved!';
                setTimeout(()=>{if(card.isConnected)card.querySelector('.notes-done').textContent='Done';},900);
              };
            } else {
              card.style.cssText='width:400px;border:1px solid #3a3f46;background:rgba(245,245,245,.05);text-align:center;';
              card.innerHTML='<h2 style="font-size:2rem;margin-bottom:20px;">GitHub</h2><button type="button" style="width:100%;background:#24292f;font-size:1.2rem;padding:20px;color:white;">Open GitHub</button>';
              card.querySelector('button').onclick=()=>window.location.href='https://github.com';
            }
            canvas.appendChild(card);setupWidget(card,canvas.querySelectorAll('.card').length-1);
            positions[id]={left:20,top:Math.max(0,canvas.clientHeight-150),x:0,y:0};
            card.style.setProperty('--widget-left','20px');card.style.setProperty('--widget-top',Math.max(0,canvas.clientHeight-150)+'px');
            save();updateCanvasHeight();picker.remove();
          });
        });

        picker.querySelector('#custom-widget-open').addEventListener('click',()=>{
          picker.querySelector('#widget-picker-panel').innerHTML=
            '<h3>Custom Widget</h3>' +
            '<div class="custom-widget-form">' +
            '<label>Widget title</label><input id="customWidgetTitle" placeholder="My Widget">' +
            '<label>Type</label><select id="customWidgetType"><option value="button">Button / Link</option><option value="iframe">Embedded page</option><option value="api">API data</option></select>' +
            '<label>URL</label><input id="customWidgetUrl" placeholder="https://example.com">' +
            '<label>Button text (button/link only)</label><input id="customWidgetButton" placeholder="Open">' +
            '<label>API key (API only, optional)</label><input id="customWidgetApiKey" type="password" placeholder="Bearer token">' +
            '<div class="custom-widget-help">API keys are stored only in this browser and sent from the page, so do not use a secret that must stay private. Browser CORS rules can prevent some APIs from loading.</div>' +
            '<button type="button" id="custom-widget-create">Create Widget</button>' +
            '<button type="button" id="custom-widget-back">Back</button>' +
            '</div>';

          picker.querySelector('#custom-widget-back').onclick=()=>{
            picker.remove();
            document.getElementById('widget-add-button').click();
          };
          picker.querySelector('#custom-widget-create').onclick=()=>{makeCustomWidget();picker.remove();};
        });
      });

      // Theme selector
      (() => {
        const themes = {
          default: { name:'Default', bg:'#0b0d12', card:'rgba(255,255,255,.055)', text:'#fff', accent:'#00e5ff' },
          midnight: { name:'Midnight Blue', bg:'#07111f', card:'rgba(30,100,180,.13)', text:'#e8f4ff', accent:'#4da3ff' },
          sunset: { name:'Sunset', bg:'#1b0c16', card:'rgba(255,100,100,.10)', text:'#fff0f3', accent:'#ff8a65' },
          forest: { name:'Forest', bg:'#07150f', card:'rgba(60,180,100,.10)', text:'#eafff0', accent:'#57d68d' },
          purple: { name:'Purple', bg:'#12091f', card:'rgba(150,80,255,.12)', text:'#f6edff', accent:'#b47cff' },
          ocean: { name:'Ocean', bg:'#06151a', card:'rgba(0,180,210,.11)', text:'#e7fcff', accent:'#35d9e8' },
          monochrome: { name:'Monochrome', bg:'#111', card:'rgba(255,255,255,.08)', text:'#fff', accent:'#fff' }
        };
        let customThemes = {};
        try { customThemes = JSON.parse(localStorage.getItem('aiGeneratedCustomThemes') || '{}'); } catch {}

        const key='aiGeneratedWebsiteTheme';

        function hexOpposite(hex) {
          const m=String(hex).match(/^#([0-9a-f]{6})$/i);
          if (!m) return '#ffffff';
          const n=parseInt(m[1],16);
          const r=255-((n>>16)&255), g=255-((n>>8)&255), b=255-(n&255);
          return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
        }

        function applyTheme(name) {
          const t=themes[name] || customThemes[name] || themes.default;
          document.body.style.background=t.bg;
          document.body.style.color=t.text;
          document.documentElement.style.setProperty('--theme-accent',t.accent);
          document.documentElement.style.setProperty('--theme-card',t.card);
          const opposite=hexOpposite(t.bg);
          document.documentElement.style.setProperty('--repo-link-bg',opposite);
          document.documentElement.style.setProperty('--repo-link-text',hexOpposite(opposite));
          document.querySelectorAll('.card').forEach(card => {
            if (!card.dataset.themeCustom) card.style.background=t.card;
          });
          localStorage.setItem(key,name);
        }

        const picker=document.createElement('div');
        picker.id='theme-picker';
        picker.innerHTML='<strong>Choose a theme</strong>';

        function addThemeButton(id,t) {
          const b=document.createElement('button');
          b.type='button'; b.textContent=t.name;
          b.style.border='1px solid '+t.accent;
          b.style.background=t.card; b.style.color=t.text;
          b.onclick=()=>{applyTheme(id);picker.classList.remove('show');};
          picker.appendChild(b);
        }

        Object.entries(themes).forEach(([id,t])=>addThemeButton(id,t));
        Object.entries(customThemes).forEach(([id,t])=>addThemeButton(id,t));

        const customTitle=document.createElement('div');
        customTitle.className='custom-theme-title';
        customTitle.textContent='Custom Theme';
        picker.appendChild(customTitle);

        const form=document.createElement('div');
        form.className='custom-theme-form';
        form.innerHTML=
          '<input id="customThemeName" placeholder="Theme name">' +
          '<label>Background <input id="customThemeBg" type="color" value="#0b0d12"></label>' +
          '<label>Card <input id="customThemeCard" type="color" value="#252833"></label>' +
          '<label>Text <input id="customThemeText" type="color" value="#ffffff"></label>' +
          '<label>Accent <input id="customThemeAccent" type="color" value="#00e5ff"></label>' +
          '<button type="button" id="createCustomTheme">Save Custom Theme</button>';
        picker.appendChild(form);

        const createButton=form.querySelector('#createCustomTheme');
        createButton.onclick=()=>{
          const name=form.querySelector('#customThemeName').value.trim() || 'My Theme';
          const id='custom-'+Date.now();
          const t={
            name,
            bg:form.querySelector('#customThemeBg').value,
            card:form.querySelector('#customThemeCard').value,
            text:form.querySelector('#customThemeText').value,
            accent:form.querySelector('#customThemeAccent').value
          };
          customThemes[id]=t;
          localStorage.setItem('aiGeneratedCustomThemes',JSON.stringify(customThemes));
          addThemeButton(id,t);
          form.querySelector('#customThemeName').value='';
          applyTheme(id);
        };

        document.body.appendChild(picker);
        const current=localStorage.getItem(key)||'default';
        applyTheme(current);
      })();

      const themeToggle=document.createElement('button');
      themeToggle.id='theme-picker-toggle';
      themeToggle.type='button';
      themeToggle.textContent='🎨 Themes';
      themeToggle.onclick=e=>{
        e.preventDefault(); e.stopPropagation();
        document.getElementById('theme-picker').classList.toggle('show');
      };
      document.body.appendChild(themeToggle);

// Keep the canvas tall enough after a window resize without touching widget positions.
      window.addEventListener('resize',updateCanvasHeight);
    })();

    // Debounce function for API calls
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    function fetchDuckDuckGoSuggestions(query) {
  return new Promise((resolve) => {
    if (!query.trim()) {
      resolve([]);
      return;
    }

    const callbackName =
      'ddg_' + Math.random().toString(36).slice(2);

    window[callbackName] = function(data) {
      resolve(
        data.map(item => item.phrase).slice(0, 8)
      );

      delete window[callbackName];
      script.remove();
    };

    const script = document.createElement('script');

    script.src =
      `https://duckduckgo.com/ac/?q=${encodeURIComponent(query)}&callback=${callbackName}`;

    script.onerror = () => {
      resolve([]);
      delete window[callbackName];
      script.remove();
    };

    document.body.appendChild(script);
  });
}

    // Fetch suggestions from Google using custom search API
    async function fetchGoogleSuggestions(query) {
  return await fetchDuckDuckGoSuggestions(query);
}
    // Fetch suggestions from YouTube using API
    async function fetchYouTubeSuggestions(query) {
  return await fetchDuckDuckGoSuggestions(query);
}

    // Fetch Wikipedia suggestions
    async function fetchWikipediaSuggestions(query) {
      if (!query.trim()) return [];
      try {
        const response = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`);
        const data = await response.json();
        return data.query.search.map(item => item.title);
      } catch (e) {
        console.error('Error fetching Wikipedia suggestions:', e);
        return [];
      }
    }

    // Display suggestions in dropdown
    function displaySuggestions(suggestions, dropdownId, inputId) {
      const dropdown = document.getElementById(dropdownId);
      const input = document.getElementById(inputId);
      
      if (suggestions.length === 0) {
        dropdown.classList.remove('show');
        return;
      }

      dropdown.innerHTML = suggestions.slice(0, 8).map(suggestion => `
        <div class="suggestion-item" onclick="setSuggestion('${inputId}', '${suggestion.replace(/'/g, "\\'")}')">
          <svg class="suggestion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <span class="suggestion-text">${escapeHtml(suggestion)}</span>
        </div>
      `).join('');

      dropdown.classList.add('show');
    }

    // Set suggestion text to input
    function setSuggestion(inputId, suggestion) {
      const input = document.getElementById(inputId);
      input.value = suggestion;
      
      // Close dropdown
      const dropdownId = inputId.replace('Input', 'Suggestions');
      document.getElementById(dropdownId).classList.remove('show');
      
      // Focus on input
      input.focus();
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Create debounced fetch functions
    const duckDuckGoFetch = debounce(async (query) => {
      const suggestions = await fetchDuckDuckGoSuggestions(query);
      displaySuggestions(suggestions, 'duckSuggestions', 'duckInput');
    }, 300);

    const googleFetch = debounce(async (query) => {
      const suggestions = await fetchGoogleSuggestions(query);
      displaySuggestions(suggestions, 'googleSuggestions', 'googleInput');
    }, 300);

    const youtubeFetch = debounce(async (query) => {
      const suggestions = await fetchYouTubeSuggestions(query);
      displaySuggestions(suggestions, 'youtubeSuggestions', 'youtubeInput');
    }, 300);

    const wikipediaFetch = debounce(async (query) => {
      const suggestions = await fetchWikipediaSuggestions(query);
      displaySuggestions(suggestions, 'wikiSuggestions', 'wikiInput');
    }, 300);

    // Add event listeners for input changes
    document.getElementById('duckInput').addEventListener('input', (e) => {
      duckDuckGoFetch(e.target.value);
    });

    document.getElementById('googleInput').addEventListener('input', (e) => {
      googleFetch(e.target.value);
    });

    document.getElementById('youtubeInput').addEventListener('input', (e) => {
      youtubeFetch(e.target.value);
    });

    document.getElementById('wikiInput').addEventListener('input', (e) => {
      wikipediaFetch(e.target.value);
    });

    // Close suggestions on blur
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box-wrapper')) {
        document.querySelectorAll('.suggestions-dropdown').forEach(el => {
          el.classList.remove('show');
        });
      }
    });

    // Search engine switcher
    (() => {
      const engines = {
        google: { name:'Google Search', title:'Google Search', placeholder:'Search Google...', search:'https://www.google.com/search?q=', home:'https://www.google.com', color:'#4285F4', bg:'rgba(66,133,244,0.08)', border:'#2f5fb3' },
        duck: { name:'DuckDuckGo', title:'DuckDuckGo', placeholder:'Search privately...', search:'https://duckduckgo.com/?q=', home:'https://duckduckgo.com', color:'#E37151', bg:'rgba(227,113,81,0.08)', border:'#b85a41' },
        bing: { name:'Bing', title:'Bing', placeholder:'Search Bing...', search:'https://www.bing.com/search?q=', home:'https://www.bing.com', color:'#008373', bg:'rgba(0,131,115,0.08)', border:'#00695c' },
        brave: { name:'Brave Search', title:'Brave Search', placeholder:'Search Brave...', search:'https://search.brave.com/search?q=', home:'https://search.brave.com', color:'#FF6B00', bg:'rgba(255,107,0,0.08)', border:'#c65300' },
        yahoo: { name:'Yahoo', title:'Yahoo Search', placeholder:'Search Yahoo...', search:'https://search.yahoo.com/search?p=', home:'https://search.yahoo.com', color:'#6001D2', bg:'rgba(96,1,210,0.08)', border:'#4b00a5' },
        youtube: { name:'YouTube', title:'YouTube', placeholder:'Find videos...', search:'https://www.youtube.com/results?search_query=', home:'https://www.youtube.com', color:'#FF0000', bg:'rgba(255,0,0,0.08)', border:'#b30000' },
        wiki: { name:'Wikipedia', title:'Wikipedia', placeholder:'Search knowledge...', search:'https://en.wikipedia.org/wiki/Special:Search?search=', home:'https://en.wikipedia.org', color:'#A2A9B1', bg:'rgba(162,169,177,0.08)', border:'#6f767d' }
      };
      const cardTypes=['duck','google','youtube','wiki'];
      const saved=JSON.parse(localStorage.getItem('searchCardEngines')||'{}');

      function applyEngine(cardType,engineType) {
        const card=document.querySelector('[data-widget-id="engine-' + cardType + '"]');
        if(!card || !engines[engineType]) return;
        const e=engines[engineType];
        card.dataset.currentEngine=engineType;
        card.querySelector('.engine-title').textContent=e.title;
        card.querySelector('.engine-title').style.color=e.color || '';
        card.style.border='1px solid '+(e.border || e.color || 'currentColor');
        card.style.background=e.bg || '';
        card.dataset.currentEngine=engineType;
        const input=card.querySelector('input');
        input.placeholder=e.placeholder;
        input.dataset.engine=engineType;
        const oldId=input.id;
        const dropdown=card.querySelector('.suggestions-dropdown');
        if(dropdown) dropdown.id=oldId.replace('Input','Suggestions');
        saved[cardType]=engineType;
        localStorage.setItem('searchCardEngines',JSON.stringify(saved));
      }

      function openPicker(cardType,button) {
        const card=button.closest('.card');
        let picker=card.querySelector('.engine-picker');
        if(picker){picker.classList.toggle('show');return;}
        picker=document.createElement('div');picker.className='engine-picker';
        Object.entries(engines).forEach(([key,e])=>{
          const b=document.createElement('button');b.type='button';b.textContent=e.name;
          b.onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();applyEngine(cardType,key);picker.classList.remove('show');};
          picker.appendChild(b);
        });
        card.appendChild(picker);picker.classList.add('show');
      }

      document.querySelectorAll('.search-engine-change').forEach(button=>{
        button.addEventListener('click',ev=>{
          ev.preventDefault();ev.stopPropagation();openPicker(button.dataset.engineCard,button);
        });
      });

      cardTypes.forEach(type=>applyEngine(type,saved[type]||type));
      window._searchEngines=engines;
    })();

    function openEngine(type) {
      const inputIds = { google:'googleInput', duck:'duckInput', youtube:'youtubeInput', wiki:'wikiInput' };
      const input = document.getElementById(inputIds[type]);
      const query = input ? input.value.trim() : '';
      const selected = input?.dataset.engine || type;
      const engines = window._searchEngines || {};
      const engine = engines[selected] || engines[type];

      if (engine) {
        window.location.href = query ? engine.search + encodeURIComponent(query) : engine.home;
      }
    }

    function handleCardClick(type, event) {
      const tag = event.target.tagName.toLowerCase();
      if (tag === 'input' || tag === 'button' || tag === 'textarea') return;
      if (document.body.classList.contains('widget-editing')) return;
      openEngine(type);
    }

    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString();
      document.getElementById('clock').textContent = time;
    }

    setInterval(updateClock, 1000);
    updateClock();

    function saveNotes() {
      const box = document.getElementById('notesBox');
      if (!box) return;
      localStorage.setItem('jasperSearchNotes', box.value);
      const button = box.parentElement.querySelector('.notes-done');
      if (button) {
        button.textContent = 'Saved!';
        setTimeout(() => { if (button.isConnected) button.textContent = 'Done'; }, 900);
      }
    }

    window.addEventListener('load', () => {
      const saved = localStorage.getItem('jasperSearchNotes');
      if(saved) {
        const notesBox = document.getElementById('notesBox');
        if (notesBox) notesBox.value = saved;
      }
      // Focus the user's chosen startup widget/input.
      const startupFocus = localStorage.getItem('startupFocus') || 'duckInput';
      const startupTarget = document.getElementById(startupFocus);
      if (startupTarget && typeof startupTarget.focus === 'function') startupTarget.focus();
    });

    // Add Enter/Return key support for search inputs
    document.getElementById('duckInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') openEngine('duck');
    });

    document.getElementById('googleInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') openEngine('google');
    });

    document.getElementById('youtubeInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') openEngine('youtube');
    });

    document.getElementById('wikiInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') openEngine('wiki');
    });

    // Add Cmd+Enter support for notes textarea (Mac) and Ctrl+Enter (Windows/Linux)
    document.getElementById('notesBox').addEventListener('keypress', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        saveNotes();
      }
    });

    // Handle all link clicks to open in current tab
    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link && !e.target.closest('.suggestions-dropdown')) {
        e.preventDefault();
        window.location.href = link.href;
      }
    });
    // Ask before leaving through a link while widget editing is active.
    document.addEventListener('click', (e) => {
      if (!document.body.classList.contains('widget-editing')) return;
      const link = e.target.closest('a');
      if (!link || e.target.closest('.suggestions-dropdown')) return;
      if (!confirm('Unsaved changes may be lost. Leave this page?')) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    // Prevent browser autocomplete history
document.querySelectorAll('input[type="search"]').forEach(input => {
  input.setAttribute('autocomplete', 'off');

  input.addEventListener('focus', () => {
    input.setAttribute('readonly', true);
    setTimeout(() => {
      input.removeAttribute('readonly');
    }, 50);
  });
});
  </script>
